[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudops-autopilot"
version = "0.1.0"
description = "Risk-aware cloud incident detection, diagnosis, remediation and verification platform"
requires-python = ">=3.14"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]